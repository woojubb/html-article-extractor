<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>기사 본문 추출 데모</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; gap: 0.5rem; margin: 1rem 0; }
  input[type=url] { flex: 1; padding: 0.5rem; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  .outlet { margin: 0.75rem 0; }
  .outlet strong { display: block; margin-bottom: 0.25rem; }
  .outlet button { margin: 0.15rem; font-size: 0.85rem; }
  #stats { color: #444; margin: 0.5rem 0; }
  #error { color: #b00020; }
  #result { white-space: pre-wrap; border: 1px solid #ccc; padding: 1rem; min-height: 6rem; }
  details { margin-top: 0.5rem; }
</style>
</head>
<body>
<h1>기사 본문 추출 데모</h1>
<p>뉴스 기사 URL을 입력하거나 아래 업체별 링크를 눌러 본문을 추출합니다.</p>
<form id="form">
  <input id="url" type="url" name="url" placeholder="https://..." required>
  <button type="submit">추출</button>
</form>
<div id="presets"></div>
<p id="stats"></p>
<p id="error"></p>
<h2>추출 텍스트</h2>
<div id="result">아직 결과가 없습니다.</div>
<details>
  <summary>추출 HTML 원본 보기</summary>
  <pre id="rawHtml"></pre>
</details>
<script>
  const form = document.getElementById('form')
  const urlInput = document.getElementById('url')
  const presets = document.getElementById('presets')
  const stats = document.getElementById('stats')
  const error = document.getElementById('error')
  const result = document.getElementById('result')
  const rawHtml = document.getElementById('rawHtml')

  async function extract (url) {
    stats.textContent = '추출 중...'
    error.textContent = ''
    result.textContent = ''
    rawHtml.textContent = ''
    const response = await fetch('/api/extract?url=' + encodeURIComponent(url))
    const data = await response.json()
    if (!data.ok) {
      stats.textContent = ''
      error.textContent = data.error
      result.textContent = '아직 결과가 없습니다.'
      return
    }
    stats.textContent = `URL: ${data.url} / ${data.bytes} bytes / ${data.fetchMs}ms / 텍스트 ${data.textChars}자`
    result.textContent = data.text
    rawHtml.textContent = data.html
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault()
    extract(urlInput.value.trim())
  })

  fetch('/api/links').then(function (response) {
    return response.json()
  }).then(function (data) {
    for (const outlet of data.outlets) {
      const box = document.createElement('div')
      box.className = 'outlet'
      const title = document.createElement('strong')
      title.textContent = outlet.name
      box.appendChild(title)
      outlet.links.forEach(function (link, index) {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = `${outlet.name} ${index + 1}`
        button.addEventListener('click', function () {
          urlInput.value = link
          extract(link)
        })
        box.appendChild(button)
      })
      presets.appendChild(box)
    }
  })
</script>
</body>
</html>
